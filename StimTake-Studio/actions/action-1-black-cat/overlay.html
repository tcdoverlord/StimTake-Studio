<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Cat Swarm Overlay</title>
<style>
html, body {
  margin:0;
  padding:0;
  overflow:hidden;
  background: transparent;
  font-family:"Arial Black", sans-serif;
}
canvas {
  position:absolute;
  top:0;
  left:0;
  z-index:0;
}
#textContainer {
  position:absolute;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  background: rgba(0,0,0,0.6);
  border-radius:12px;
  padding:15px 25px;
  text-align:center;
  max-width:500px;
  z-index:5;
}
#textContainer h2 {
  margin:0;
  font-size:32px;
  color: purple;
  text-shadow:0 0 15px violet;
}
#textContainer p {
  margin-top:10px;
  font-size:18px;
  color:white;
}
</style>
</head>
<body>
<canvas id="overlay"></canvas>
<div id="textContainer">
  <h2>😺 Black Cat Swarm!</h2>
  <p>The Den is alive! Black Cats, sparkles, and hearts celebrate your legendary support!</p>
</div>

<script>
const canvas = document.getElementById('overlay');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
window.addEventListener('resize',()=>{canvas.width=window.innerWidth; canvas.height=window.innerHeight;});

// ---------- Particle Class ----------
class Particle {
  constructor(x, y, color){
    this.x=x; this.y=y;
    this.vx=Math.random()*2-1;
    this.vy=Math.random()*-2-1;
    this.size=Math.random()*3+1;
    this.alpha=1;
    this.color=color||`hsl(${Math.random()*360},80%,70%)`;
  }
  update(){ this.x+=this.vx; this.y+=this.vy; this.alpha-=0.02; }
  draw(){
    ctx.globalAlpha=this.alpha;
    ctx.fillStyle=this.color;
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha=1;
  }
}
const particles=[];

// ---------- Flying Black Cats ----------
class BlackCat {
  constructor(imgSrc){
    this.img=new Image();
    this.img.src=imgSrc;
    this.reset();
  }
  reset(){
    this.x=Math.random()*canvas.width;
    this.y=Math.random()*canvas.height;
    this.size=Math.random()*40+30;
    this.vx=(Math.random()-0.5)*8; // horizontal speed
    this.vy=(Math.random()-0.5)*6; // vertical speed
    this.rotation=Math.random()*Math.PI*2;
    this.rotationSpeed=(Math.random()*0.1)-0.05;
  }
  update(){
    this.x+=this.vx;
    this.y+=this.vy;
    this.rotation+=this.rotationSpeed;
    if(this.x<-100||this.x>canvas.width+100||this.y<-100||this.y>canvas.height+100){
      this.reset();
    }
    // generate spark particles
    particles.push(new Particle(this.x,this.y,'purple'));
  }
  draw(){
    ctx.save();
    ctx.translate(this.x,this.y);
    ctx.rotate(this.rotation);
    ctx.drawImage(this.img,-this.size/2,-this.size/2,this.size,this.size);
    ctx.restore();
  }
}

// ---------- Initialize Black Cats ----------
const blackCats=[];
for(let i=0;i<40;i++){
  blackCats.push(new BlackCat('cardimages/cat.png'));
}

// ---------- Hearts ----------
class Heart{
  constructor(){ this.x=Math.random()*canvas.width; this.y=canvas.height; this.size=Math.random()*30+20; this.alpha=1; this.vy=Math.random()*-2-1;}
  update(){ this.y+=this.vy; this.alpha-=0.015; }
  draw(){ if(this.alpha<=0) return; ctx.save(); ctx.globalAlpha=this.alpha; ctx.fillStyle='pink'; ctx.beginPath(); const x=this.x,y=this.y,s=this.size; ctx.moveTo(x,y); ctx.bezierCurveTo(x+s/2,y-s/2,x+s,y+s/3,x,y+s/2); ctx.bezierCurveTo(x-s,y+s/3,x-s/2,y-s/2,x,y); ctx.fill(); ctx.restore();}
}
const hearts=[]; setInterval(()=>{hearts.push(new Heart());},400);

// ---------- Animate ----------
function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  blackCats.forEach(c=>{c.update();c.draw();});
  hearts.forEach((h,i)=>{h.update();h.draw(); if(h.alpha<=0) hearts.splice(i,1);});
  for(let i=particles.length-1;i>=0;i--){particles[i].update();particles[i].draw(); if(particles[i].alpha<=0) particles.splice(i,1);}

  requestAnimationFrame(animate);
}
animate();

// Auto-hide overlay after 12 seconds
setTimeout(()=>{
  document.getElementById('textContainer').style.display='none';
  canvas.style.display='none';
},12000);
</script>
</body>
</html>
