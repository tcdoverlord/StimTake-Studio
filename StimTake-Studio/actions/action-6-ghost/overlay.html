<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spooky Ghost Overlay – Tip Celebration</title>
<style>
html, body {
  margin:0; padding:0; overflow:hidden; background: transparent;
  font-family:"Arial Black", sans-serif;
}
canvas { position:absolute; top:0; left:0; z-index:0; }
#textContainer {
  position:absolute;
  bottom:20px; left:50%;
  transform:translateX(-50%);
  background: rgba(0,0,0,0.5);
  border-radius:12px;
  padding:12px 20px;
  text-align:center;
  max-width:500px;
  z-index:5;
}
#textContainer h2 {
  margin:0;
  font-size:28px;
  color: white;
  text-shadow:0 0 15px violet;
  animation: glowText 2s ease-in-out infinite alternate;
}
@keyframes glowText {
  from { text-shadow:0 0 10px violet; }
  to { text-shadow:0 0 25px purple; }
}
.floatingText {
  position:absolute;
  color:white;
  font-size:24px;
  font-weight:bold;
  text-shadow:0 0 15px purple;
  pointer-events:none;
}
</style>
</head>
<body>
<canvas id="overlay"></canvas>
<div id="textContainer">
  <h2>👻 Thanks for the tips, my ghostly friend! 👻</h2>
</div>

<script>
const canvas=document.getElementById('overlay');
const ctx=canvas.getContext('2d');
canvas.width=window.innerWidth; canvas.height=window.innerHeight;
window.addEventListener('resize',()=>{canvas.width=window.innerWidth; canvas.height=window.innerHeight;});

// ---------- Particle ----------
class Particle {
  constructor(x,y,color,vy,vx){
    this.x=x; this.y=y; this.vx=vx||Math.random()*2-1; this.vy=vy||Math.random()*-2-1;
    this.size=Math.random()*3+1; this.alpha=1; this.color=color||'violet';
  }
  update(){ this.x+=this.vx; this.y+=this.vy; this.alpha-=0.02; }
  draw(){ ctx.globalAlpha=this.alpha; ctx.fillStyle=this.color; ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1;}
}
const particles=[];

// ---------- Hearts ----------
class Heart{
  constructor(){ this.x=Math.random()*canvas.width; this.y=canvas.height; this.size=Math.random()*25+15; this.alpha=1; this.vx=(Math.random()-0.5)*1.5; this.vy=Math.random()*-2-1;}
  update(){ this.x+=this.vx; this.y+=this.vy; this.alpha-=0.015;}
  draw(){ if(this.alpha<=0) return; ctx.save(); ctx.globalAlpha=this.alpha; ctx.fillStyle='pink'; ctx.beginPath(); const x=this.x,y=this.y,s=this.size; ctx.moveTo(x,y); ctx.bezierCurveTo(x+s/2,y-s/2,x+s,y+s/3,x,y+s/2); ctx.bezierCurveTo(x-s,y+s/3,x-s/2,y-s/2,x,y); ctx.fill(); ctx.restore();}
}
const hearts=[]; setInterval(()=>{hearts.push(new Heart());},300);

// ---------- Floating Text ----------
const textLines=["Thanks for the tips, my ghostly friend! 👻","Boo! 👻 Thanks!","👻 Ghostly gratitude!","Your tip haunts me in the best way!"];
class FloatingText {
  constructor(){
    this.reset();
  }
  reset(){
    this.text=textLines[Math.floor(Math.random()*textLines.length)];
    this.x=Math.random()*canvas.width;
    this.y=canvas.height+30+Math.random()*50;
    this.alpha=1;
    this.size=18+Math.random()*12;
    this.vy=-1-Math.random()*1.5;
  }
  update(){ this.y+=this.vy; this.alpha-=0.005; if(this.alpha<=0) this.reset(); }
  draw(){ ctx.globalAlpha=this.alpha; ctx.fillStyle='white'; ctx.font=`${this.size}px Arial Black`; ctx.textAlign='center'; ctx.fillText(this.text,this.x,this.y); ctx.globalAlpha=1;}
}
const floatingTexts=[]; for(let i=0;i<10;i++) floatingTexts.push(new FloatingText());

// ---------- Ghost ----------
class Ghost {
  constructor(imgSrc){
    this.img=new Image(); this.img.src=imgSrc;
    this.x=Math.random()*canvas.width;
    this.y=Math.random()*canvas.height;
    this.size=100+Math.random()*30;
    this.angle=Math.random()*Math.PI*2;
    this.speedX=(Math.random()-0.5)*1.2;
    this.speedY=(Math.random()-0.5)*0.8;
    this.orbitingGhosts=[];
    for(let i=0;i<3;i++) this.orbitingGhosts.push(new MiniGhost(this));
  }
  update(){
    this.x+=this.speedX;
    this.y+=this.speedY;
    if(this.x<0 || this.x>canvas.width) this.speedX*=-1;
    if(this.y<0 || this.y>canvas.height) this.speedY*=-1;
    this.angle+=0.02;
    this.orbitingGhosts.forEach(g=>g.update());
    if(Math.random()<0.3) particles.push(new Particle(this.x+Math.random()*50-25,this.y+Math.random()*50-25,'violet'));
  }
  draw(){
    ctx.save();
    ctx.globalAlpha=0.5+0.3*Math.sin(this.angle*4);
    ctx.fillStyle='purple';
    ctx.beginPath(); ctx.arc(this.x,this.y,this.size*0.8,0,Math.PI*2); ctx.fill(); ctx.restore();
    ctx.save();
    ctx.translate(this.x,this.y);
    ctx.rotate(Math.sin(this.angle)*0.05);
    ctx.drawImage(this.img,-this.size/2,-this.size/2,this.size,this.size);
    ctx.restore();
    this.orbitingGhosts.forEach(g=>g.draw());
  }
}

// ---------- Orbiting Mini Ghost ----------
class MiniGhost{
  constructor(parent){
    this.parent=parent;
    this.angle=Math.random()*Math.PI*2;
    this.radius=40+Math.random()*40;
    this.size=25+Math.random()*20;
    this.speed=0.02+Math.random()*0.03;
  }
  update(){ this.angle+=this.speed; }
  draw(){
    const x=this.parent.x+Math.cos(this.angle)*this.radius;
    const y=this.parent.y+Math.sin(this.angle)*this.radius;
    ctx.save(); ctx.globalAlpha=0.4; ctx.drawImage(this.parent.img,x-this.size/2,y-this.size/2,this.size,this.size); ctx.restore();
  }
}

// ---------- Initialize Multiple Ghosts ----------
const ghosts=[];
for(let i=0;i<5;i++) ghosts.push(new Ghost('cardimages/ghost.png'));

// ---------- Animate ----------
function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ghosts.forEach(g=>{g.update(); g.draw();});
  floatingTexts.forEach(f=>{f.update(); f.draw();});
  hearts.forEach((h,i)=>{h.update();h.draw(); if(h.alpha<=0) hearts.splice(i,1);});
  for(let i=particles.length-1;i>=0;i--){particles[i].update();particles[i].draw(); if(particles[i].alpha<=0) particles.splice(i,1);}
  requestAnimationFrame(animate);
}
animate();

// Auto-hide after 20 seconds
setTimeout(()=>{
  document.getElementById('textContainer').style.display='none';
  canvas.style.display='none';
},20000);
</script>
</body>
</html>
