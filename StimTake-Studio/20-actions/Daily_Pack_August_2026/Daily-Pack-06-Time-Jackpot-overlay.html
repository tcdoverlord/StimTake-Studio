<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StimTake Daily Time Jackpot</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
.scene{position:relative;width:100%;height:100%;display:grid;place-items:center;pointer-events:none}
.glow{position:absolute;width:980px;height:840px;border-radius:50%;background:radial-gradient(circle,rgba(170,92,255,.26),rgba(255,105,180,.11) 48%,transparent 72%);filter:blur(18px)}
.panel{position:relative;width:min(980px,94vw);padding:30px 34px 36px;border-radius:30px;border:2px solid rgba(175,96,255,.74);background:linear-gradient(180deg,rgba(26,19,42,.95),rgba(11,9,20,.96));box-shadow:0 0 36px rgba(175,96,255,.52),0 0 74px rgba(255,105,180,.16)}
.title{text-align:center;color:#fff5fb;font-size:38px;font-weight:1000;letter-spacing:.07em;text-transform:uppercase;text-shadow:0 0 16px rgba(175,96,255,.9)}
.subtitle{text-align:center;color:#d8cce2;margin-top:6px;font-size:15px}
.stage{position:relative;width:840px;height:470px;margin:24px auto 0;border-radius:24px;overflow:hidden;background:radial-gradient(circle at 50% 55%,rgba(255,255,255,.035),transparent 58%),linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,.01));border:1px solid rgba(255,255,255,.06)}
.card{position:absolute;left:50%;top:50%;width:560px;min-height:280px;margin-left:-280px;margin-top:-140px;padding:30px;border-radius:28px;background:linear-gradient(145deg,rgba(37,24,57,.95),rgba(18,12,28,.96));border:2px solid rgba(175,96,255,.55);box-shadow:0 0 36px rgba(175,96,255,.38);text-align:center}
.roll{font-size:18px;color:#cdb8df;font-weight:900;letter-spacing:.12em}
.time{margin-top:10px;color:#ff9d3c;font-size:96px;line-height:.95;font-weight:1000;text-shadow:0 0 24px rgba(255,157,60,.62)}
.unit{margin-top:6px;color:#fff5fb;font-size:24px;font-weight:1000;letter-spacing:.08em}
.activity{margin-top:14px;color:#ff8fc9;font-size:28px;font-weight:1000;text-shadow:0 0 12px rgba(255,143,201,.45)}
.countdown{margin-top:14px;color:#c98cff;font-size:28px;font-weight:900;min-height:36px}
.progress{margin:18px auto 0;width:86%;height:18px;border-radius:999px;background:#17111f;border:2px solid rgba(255,255,255,.08);overflow:hidden}
.progress-bar{height:100%;width:0%;background:linear-gradient(90deg,#8f5cff,#ff6fae,#ff9d3c);transition:width .35s linear}
.badge{position:absolute;left:50%;top:22px;transform:translateX(-50%);padding:8px 18px;border-radius:999px;background:rgba(16,10,24,.88);border:1px solid rgba(255,157,60,.45);color:#ffb36a;font-size:12px;font-weight:1000;letter-spacing:.14em}
.card.jackpot{border-color:#ff9d3c;box-shadow:0 0 38px rgba(255,157,60,.45),0 0 64px rgba(175,96,255,.45)}
.card.jackpot .time{font-size:110px}
.card.jackpot .activity{font-size:34px;color:#fff2e4}
.spark{position:absolute;font-size:30px;opacity:0}
.card.jackpot .spark{animation:spark 1.1s ease-out infinite}
.sp1{left:30px;top:28px}.sp2{right:30px;top:34px;animation-delay:.2s}.sp3{left:55px;bottom:32px;animation-delay:.4s}.sp4{right:55px;bottom:30px;animation-delay:.6s}
.confetti{position:absolute;left:50%;top:52%;z-index:8}
.confetti i{position:absolute;width:10px;height:18px;opacity:0}
.confetti.active i{animation:confetti 1.25s ease-out forwards}
.confetti i:nth-child(1){background:#ff7eb6;--x:-220px;--y:-190px}
.confetti i:nth-child(2){background:#8f6cff;--x:-140px;--y:-240px;animation-delay:.05s}
.confetti i:nth-child(3){background:#55c9ff;--x:-50px;--y:-220px;animation-delay:.1s}
.confetti i:nth-child(4){background:#ffd65c;--x:50px;--y:-250px;animation-delay:.15s}
.confetti i:nth-child(5){background:#66ddb2;--x:145px;--y:-195px;animation-delay:.2s}
.confetti i:nth-child(6){background:#ff9d3c;--x:225px;--y:-155px;animation-delay:.25s}
.confetti i:nth-child(7){background:#fff;--x:-190px;--y:-80px;animation-delay:.3s}
.confetti i:nth-child(8){background:#ff7eb6;--x:190px;--y:-75px;animation-delay:.35s}
.result{min-height:78px;margin-top:16px;text-align:center;color:#fff5fb;font-size:28px;font-weight:900}
.result .headline{color:#ff9d3c;text-shadow:0 0 12px rgba(255,157,60,.55)}
.result .message{display:block;margin-top:8px;color:#c98cff;font-size:20px}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0}.flash.active{animation:flash .9s ease-out}
.footer{text-align:center;margin-top:8px;color:#9f93aa;font-size:12px}
@keyframes spark{0%{opacity:0;transform:scale(.5) rotate(0)}45%{opacity:1}100%{opacity:0;transform:scale(1.6) rotate(120deg)}}
@keyframes confetti{0%{opacity:0;transform:translate(0,0) rotate(0)}20%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(620deg)}}
@keyframes flash{0%{opacity:0}25%{opacity:1;background:radial-gradient(circle,rgba(255,255,255,.35),transparent 48%)}100%{opacity:0}}
@media(max-height:760px){.panel{transform:scale(.83)}}
</style>
</head>
<body>
<div class="scene"><div class="glow"></div>
<section class="panel">
<div class="flash" id="flash"></div>
<div class="title">⏱️ Time Jackpot</div>
<div class="subtitle">One trigger. One timed prize. The jackpot runs for two full minutes.</div>

<div class="stage">
  <div class="badge" id="badge">ROLLING FOR TIME...</div>

  <div class="card" id="card">
    <div class="spark sp1">✨</div><div class="spark sp2">💖</div><div class="spark sp3">⭐</div><div class="spark sp4">✨</div>
    <div class="roll" id="rollText">TIME PRIZE</div>
    <div class="time" id="timeValue">60</div>
    <div class="unit">SECONDS</div>
    <div class="activity" id="activity">Hot Minute</div>
    <div class="countdown" id="countdown">Ready...</div>
    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
  </div>

  <div class="confetti" id="confetti">
    <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
  </div>
</div>

<div class="result" id="result">Picking the timed prize...</div>
<div class="footer">StimTake Studio • Daily Pack • Time Jackpot</div>
</section></div>

<script>
(()=>{
const card=document.getElementById('card');
const badge=document.getElementById('badge');
const timeValue=document.getElementById('timeValue');
const activity=document.getElementById('activity');
const countdown=document.getElementById('countdown');
const progressBar=document.getElementById('progressBar');
const result=document.getElementById('result');
const flash=document.getElementById('flash');
const confetti=document.getElementById('confetti');

let running=false;
let timer=null;

let prizes=[
 {seconds:30,title:'Flirty Pose',label:'QUICK WIN'},
 {seconds:60,title:'Tease Dance',label:'HOT MINUTE'},
 {seconds:60,title:"Model's Choice",label:'MODEL TIME'},
 {seconds:90,title:'Flirty Challenge',label:'DOUBLE TIME'},
 {seconds:120,title:'Strip Show',label:'JACKPOT'}
];

function setPrizes(next){
 if(!Array.isArray(next)||!next.length)return;
 prizes=next.slice(0,5).map((p,i)=>({
   seconds:Math.max(1,Number(p.seconds)||prizes[i].seconds),
   title:String(p.title||prizes[i].title),
   label:String(p.label||prizes[i].label)
 }));
}

function formatTime(sec){
 const m=Math.floor(sec/60);
 const s=sec%60;
 return `${m}:${String(s).padStart(2,'0')}`;
}

function reset(){
 if(timer){clearInterval(timer);timer=null}
 card.classList.remove('jackpot');
 confetti.classList.remove('active');
 progressBar.style.width='0%';
 countdown.textContent='Ready...';
 badge.textContent='ROLLING FOR TIME...';
}

function start(options={}){
 if(running)return false;
 running=true;
 if(Array.isArray(options.prizes))setPrizes(options.prizes);
 reset();

 const forced=Number.isInteger(options.index)?Math.max(0,Math.min(4,options.index)):null;
 const selected=forced!==null?forced:Math.floor(Math.random()*5);
 const prize=prizes[selected];

 let ticks=0;
 const roller=setInterval(()=>{
   const p=prizes[Math.floor(Math.random()*prizes.length)];
   timeValue.textContent=p.seconds;
   activity.textContent=p.title;
   badge.textContent=p.label;
   ticks++;
   if(ticks>=12){
     clearInterval(roller);

     timeValue.textContent=prize.seconds;
     activity.textContent=prize.title;
     badge.textContent=prize.label;

     if(prize.seconds===120){
       card.classList.add('jackpot');
       confetti.classList.remove('active');
       void confetti.offsetWidth;
       confetti.classList.add('active');
     }

     flash.classList.remove('active');
     void flash.offsetWidth;
     flash.classList.add('active');

     result.innerHTML=`⏱️ <span class="headline">${prize.seconds} SECONDS — ${prize.title}</span><span class="message">${prize.label}</span>`;

     let remaining=prize.seconds;
     countdown.textContent=formatTime(remaining);
     progressBar.style.width='100%';

     timer=setInterval(()=>{
       remaining--;
       countdown.textContent=formatTime(Math.max(0,remaining));
       progressBar.style.width=((Math.max(0,remaining)/prize.seconds)*100)+'%';

       if(remaining<=0){
         clearInterval(timer);
         timer=null;
         countdown.textContent='TIME!';
         progressBar.style.width='0%';

         window.parent?.postMessage?.({
           type:'stimtake-daily-time-jackpot-finished',
           index:selected,
           prize
         },'*');

         running=false;
       }
     },1000);

     window.parent?.postMessage?.({
       type:'stimtake-daily-time-jackpot-result',
       index:selected,
       prize
     },'*');
   }
 },170);

 return true;
}

window.StimTakeDailyTimeJackpot={start,setPrizes};

window.addEventListener('message',e=>{
 const d=e.data||{};
 if(d.type==='stimtake-daily-time-jackpot'){
   start({
     index:Number.isInteger(d.index)?d.index:undefined,
     prizes:Array.isArray(d.prizes)?d.prizes:undefined
   });
 }
});

setTimeout(()=>start(),800);
})();
</script>
</body>
</html>
