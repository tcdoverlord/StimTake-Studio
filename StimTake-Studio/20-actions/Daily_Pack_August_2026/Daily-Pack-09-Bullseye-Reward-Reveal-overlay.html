<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StimTake Daily Bullseye - Enhanced</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
.scene{position:relative;width:100%;height:100%;display:grid;place-items:center;pointer-events:none}
.glow{position:absolute;width:900px;height:800px;border-radius:50%;background:radial-gradient(circle,rgba(170,92,255,.24),rgba(255,105,180,.09) 48%,transparent 72%);filter:blur(18px)}
.panel{position:relative;width:min(1000px,95vw);padding:28px 34px 34px;border-radius:28px;border:2px solid rgba(175,96,255,.72);background:linear-gradient(180deg,rgba(26,19,42,.95),rgba(11,9,20,.96));box-shadow:0 0 34px rgba(175,96,255,.5),0 0 70px rgba(255,105,180,.14)}
.title{text-align:center;color:#fff5fb;font-size:38px;font-weight:1000;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 0 15px rgba(175,96,255,.85)}
.subtitle{text-align:center;color:#d8cce2;margin-top:5px;font-size:15px}
.arena{position:relative;width:860px;height:520px;margin:20px auto 0}
.target-wrap{position:absolute;left:225px;top:45px;width:410px;height:410px}
.target{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#ffd65c 0 9%,#ff547e 9% 20%,#fff 20% 32%,#58c5ff 32% 45%,#fff 45% 59%,#7d4dff 59% 73%,#fff 73% 88%,#34283e 88% 100%);border:9px solid #1b1424;box-shadow:0 0 34px rgba(125,77,255,.42),inset 0 0 30px rgba(0,0,0,.2)}
.target:before,.target:after{content:"";position:absolute;background:rgba(0,0,0,.16)}
.target:before{left:50%;top:0;bottom:0;width:2px}
.target:after{top:50%;left:0;right:0;height:2px}
.prizes{position:absolute;left:0;top:62px;width:310px;padding:18px 20px;border-radius:20px;background:rgba(19,14,29,.82);border:1px solid rgba(175,96,255,.35);box-shadow:0 0 22px rgba(175,96,255,.16)}
.prizes h3{margin:0 0 12px;text-align:center;color:#ff9dcb;font-size:18px}
.prize{display:flex;gap:10px;align-items:center;margin:8px 0;color:#e9dff0;font-size:14px;font-weight:800}
.points{min-width:54px;color:#ffb15e;text-align:right}
.dart{position:absolute;left:250px;top:250px;width:190px;height:52px;z-index:20;transform-origin:170px 26px}
.dart-body{position:absolute;right:25px;top:20px;width:122px;height:12px;border-radius:999px;background:linear-gradient(90deg,#ff7eb6,#8f5cff);box-shadow:0 0 12px rgba(143,92,255,.45)}
.dart-tip{position:absolute;right:0;top:15px;width:0;height:0;border-top:11px solid transparent;border-bottom:11px solid transparent;border-left:30px solid #f4e6ff}
.dart-feather{position:absolute;left:5px;top:7px;width:44px;height:38px;background:linear-gradient(145deg,#ff9d3c,#ff6fae);clip-path:polygon(0 0,100% 50%,0 100%,20% 50%)}
.dart.flying{animation:fly 1.45s cubic-bezier(.15,.72,.08,1) forwards}
.dart.stuck{filter:drop-shadow(0 0 9px rgba(255,157,60,.75))}
.impact{position:absolute;width:82px;height:82px;border-radius:50%;border:4px solid rgba(255,255,255,.9);box-shadow:0 0 28px rgba(255,157,60,.9);opacity:0;z-index:15}
.impact.show{animation:impact .8s ease-out forwards}
.score-burst{position:absolute;left:50%;bottom:0;width:520px;padding:15px 24px;border-radius:22px;text-align:center;opacity:0;transform:translateX(-50%) scale(.5);background:linear-gradient(180deg,rgba(36,22,52,.96),rgba(15,11,24,.96));border:2px solid rgba(255,157,60,.72);box-shadow:0 0 28px rgba(255,157,60,.34),0 0 50px rgba(175,96,255,.2);z-index:30}
.score-burst.show{animation:pop .8s ease-out forwards}
.score{font-size:60px;font-weight:1000;color:#ff9d3c;text-shadow:0 0 18px rgba(255,157,60,.65)}
.reward{color:#fff5fb;font-size:20px;font-weight:900}
.result{min-height:74px;margin-top:4px;text-align:center;color:#fff5fb;font-size:28px;font-weight:900}
.result .headline{color:#ff9d3c;text-shadow:0 0 12px rgba(255,157,60,.55)}
.result .message{display:block;margin-top:7px;color:#c98cff;font-size:19px}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0}.flash.active{animation:flash .9s ease-out}
.footer{text-align:center;margin-top:8px;color:#9f93aa;font-size:12px}
@keyframes fly{
  0%{transform:translate(-180px,90px) rotate(-12deg) scale(.85)}
  28%{transform:translate(30px,20px) rotate(-5deg) scale(.95)}
  68%{transform:translate(250px,-18px) rotate(-1deg) scale(1)}
  100%{transform:translate(350px,-18px) rotate(0deg) scale(1)}
}
@keyframes impact{0%{opacity:0;transform:scale(.2)}35%{opacity:1}100%{opacity:0;transform:scale(1.7)}}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) scale(.5) rotate(-5deg)}55%{opacity:1;transform:translateX(-50%) scale(1.08) rotate(1deg)}100%{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes flash{0%{opacity:0}25%{opacity:1;background:radial-gradient(circle,rgba(255,255,255,.34),transparent 48%)}100%{opacity:0}}
@media(max-height:760px){.panel{transform:scale(.82)}}
</style>
</head>
<body>
<div class="scene">
<div class="glow"></div>
<section class="panel">
<div class="flash" id="flash"></div>
<div class="title">🎯 Bullseye</div>
<div class="subtitle">One shot. One hidden reward. Watch where the dart lands.</div>

<div class="arena">

  <div class="score-burst" id="scoreBurst">
    <div class="score" id="score">100</div>
    <div class="reward" id="reward">Prize Revealed</div>
  </div>

  <div class="target-wrap" id="targetWrap">
    <div class="target"></div>
    <div class="impact" id="impact"></div>
  </div>

  <div class="dart" id="dart">
    <div class="dart-feather"></div>
    <div class="dart-body"></div>
    <div class="dart-tip"></div>
  </div>
</div>

<div class="result" id="result">Loading the dart...</div>
<div class="footer">StimTake Studio • Daily Pack • Enhanced Bullseye</div>
</section>
</div>

<script>
(()=>{
const dart=document.getElementById('dart');
const impact=document.getElementById('impact');
const scoreBurst=document.getElementById('scoreBurst');
const scoreEl=document.getElementById('score');
const rewardEl=document.getElementById('reward');
const result=document.getElementById('result');
const flash=document.getElementById('flash');

let running=false;

let zones=[
 {score:100,reward:'Jackpot — Remove Top / Model Choice',label:'BULLSEYE!',radius:0},
 {score:75,reward:'Viewer Chooses a Tease',label:'AMAZING!',radius:42},
 {score:50,reward:'Remove One Clothing Item',label:'GREAT SHOT!',radius:78},
 {score:25,reward:'Slow Dance',label:'NICE!',radius:118},
 {score:10,reward:'Sexy Pose',label:'LUCKY HIT!',radius:154}
];

function setPrizes(next){
 if(!Array.isArray(next)||next.length<5)return;
 zones=next.slice(0,5).map((z,i)=>({
   score:Number(z.score)||zones[i].score,
   reward:String(z.reward||zones[i].reward),
   label:String(z.label||zones[i].label),
   radius:zones[i].radius
 }));
}

function throwDart(options={}){
 if(running)return false;
 running=true;
 if(Array.isArray(options.prizes))setPrizes(options.prizes);

 result.textContent='The dart is flying...';
 scoreBurst.classList.remove('show');
 impact.classList.remove('show');
 dart.classList.remove('flying','stuck');
 dart.style.transform='';
 void dart.offsetWidth;

 const forced=Number.isInteger(options.zone)?Math.max(0,Math.min(4,options.zone)):null;
 const selected=forced!==null?forced:Math.floor(Math.random()*5);
 const zone=zones[selected];

 // The dart's final point is deliberately placed INTO the target.
 // The visible shaft remains outside, making it look embedded rather than passing through.
 const angle=Math.random()*Math.PI*2;
 const r=zone.radius;
 const centerX=205, centerY=205;
 const hitX=centerX+Math.cos(angle)*r;
 const hitY=centerY+Math.sin(angle)*r;

 dart.classList.add('flying');

 setTimeout(()=>{
   dart.classList.remove('flying');
   dart.classList.add('stuck');

   // target-wrap starts at arena x=225,y=45.
   // Dart tip is at x≈190,y≈26 relative to dart.
   const arenaHitX=225+hitX;
   const arenaHitY=45+hitY;
   const dartLeft=arenaHitX-190;
   const dartTop=arenaHitY-26;
   dart.style.left=dartLeft+'px';
   dart.style.top=dartTop+'px';
   dart.style.transform='rotate(-2deg)';

   impact.style.left=(hitX-41)+'px';
   impact.style.top=(hitY-41)+'px';
   impact.classList.remove('show');
   void impact.offsetWidth;
   impact.classList.add('show');

   scoreEl.textContent=zone.score;
   rewardEl.textContent=zone.reward;
   scoreBurst.classList.remove('show');
   void scoreBurst.offsetWidth;
   scoreBurst.classList.add('show');

   result.innerHTML=`🎯 <span class="headline">${zone.score} POINTS — ${zone.label}</span><span class="message">${zone.reward}</span>`;

   flash.classList.remove('active');
   void flash.offsetWidth;
   flash.classList.add('active');

   running=false;
   window.parent?.postMessage?.({
     type:'stimtake-daily-bullseye-result',
     zone:selected,
     score:zone.score,
     reward:zone.reward,
     label:zone.label
   },'*');
 },1450);

 return true;
}

window.StimTakeDailyBullseye={throw:throwDart,setPrizes};

window.addEventListener('message',event=>{
 const d=event.data||{};
 if(d.type==='stimtake-daily-bullseye-throw'){
   throwDart({
     zone:Number.isInteger(d.zone)?d.zone:undefined,
     prizes:Array.isArray(d.prizes)?d.prizes:undefined
   });
 }
});

setTimeout(()=>throwDart(),800);
})();
</script>
</body>
</html>
