<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StimTake Daily Balloon Pop</title>
<style>
html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:transparent;
  font-family:"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
.scene{
  position:relative;
  width:100%;
  height:100%;
  display:grid;
  place-items:center;
  pointer-events:none;
}
.glow{
  position:absolute;
  width:900px;
  height:800px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(170,92,255,.22),rgba(255,105,180,.09) 48%,transparent 72%);
  filter:blur(18px);
}
.sparkle{
  position:absolute;
  font-size:30px;
  opacity:.6;
  filter:drop-shadow(0 0 8px rgba(255,255,255,.2));
}
.s1{top:14%;left:14%}
.s2{top:21%;right:16%}
.s3{bottom:16%;left:18%}
.s4{bottom:14%;right:19%}

.panel{
  position:relative;
  width:min(980px,94vw);
  padding:30px 34px 36px;
  border-radius:28px;
  border:2px solid rgba(175,96,255,.70);
  background:linear-gradient(180deg,rgba(26,19,42,.94),rgba(11,9,20,.95));
  box-shadow:0 0 32px rgba(175,96,255,.48),0 0 64px rgba(255,105,180,.14);
}
.title{
  text-align:center;
  color:#fff5fb;
  font-size:36px;
  font-weight:900;
  letter-spacing:.06em;
  text-transform:uppercase;
  text-shadow:0 0 14px rgba(175,96,255,.8);
}
.subtitle{
  text-align:center;
  color:#d8cce2;
  margin-top:6px;
  font-size:15px;
}
.field{
  position:relative;
  width:840px;
  height:460px;
  margin:26px auto 0;
  border-radius:22px;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 115%,rgba(175,96,255,.08),transparent 44%),
    linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,.01));
  border:1px solid rgba(255,255,255,.06);
}
.balloon-wrap{
  position:absolute;
  width:140px;
  height:220px;
  text-align:center;
  transition:opacity .35s ease,filter .35s ease,transform .35s ease;
}
.b1{left:65px;top:165px}
.b2{left:220px;top:70px}
.b3{left:375px;top:160px}
.b4{left:530px;top:65px}
.b5{left:685px;top:155px}
.balloon{
  position:relative;
  width:105px;
  height:130px;
  margin:0 auto;
  border-radius:50% 50% 46% 46%;
  box-shadow:inset 0 0 24px rgba(255,255,255,.18),0 10px 18px rgba(0,0,0,.2);
  transform-origin:center bottom;
}
.b1 .balloon{background:linear-gradient(145deg,#ff77b7,#d7478e)}
.b2 .balloon{background:linear-gradient(145deg,#8f6cff,#5b3acb)}
.b3 .balloon{background:linear-gradient(145deg,#55c9ff,#277ec0)}
.b4 .balloon{background:linear-gradient(145deg,#66ddb2,#24996e)}
.b5 .balloon{background:linear-gradient(145deg,#ffb65f,#e37724)}
.balloon:before{
  content:"";
  position:absolute;
  left:50%;
  bottom:-13px;
  margin-left:-9px;
  width:18px;
  height:18px;
  background:inherit;
  clip-path:polygon(50% 0,100% 100%,0 100%);
}
.balloon:after{
  content:"";
  position:absolute;
  top:16px;
  left:24px;
  width:22px;
  height:44px;
  border-radius:50%;
  background:rgba(255,255,255,.24);
  transform:rotate(18deg);
}
.string{
  position:absolute;
  left:50%;
  top:143px;
  width:2px;
  height:72px;
  background:rgba(255,255,255,.3);
}
.name{
  margin-top:82px;
  color:#efe6f6;
  font-size:13px;
  font-weight:900;
}
.balloon-wrap.float .balloon{
  animation:float 1.1s ease-in-out infinite alternate;
}
.balloon-wrap.dim{
  opacity:.18;
  filter:saturate(.4);
}
.balloon-wrap.winner{
  transform:scale(1.1) translateY(-10px);
}
.balloon-wrap.winner .balloon{
  filter:drop-shadow(0 0 18px rgba(255,255,255,.7));
}
.balloon-wrap.pop .balloon{
  animation:pop .35s ease-out forwards;
}
.prize-card{
  position:absolute;
  left:50%;
  top:50%;
  width:360px;
  min-height:120px;
  margin-left:-180px;
  margin-top:-60px;
  padding:20px 24px;
  border-radius:20px;
  background:rgba(24,17,36,.94);
  border:2px solid rgba(255,157,60,.7);
  box-shadow:0 0 30px rgba(255,157,60,.35),0 0 50px rgba(175,96,255,.4);
  text-align:center;
  opacity:0;
  transform:scale(.75);
  z-index:7;
}
.prize-card.show{
  animation:reveal .6s ease-out forwards;
}
.prize-title{
  color:#ff9d3c;
  font-size:28px;
  font-weight:900;
}
.prize-message{
  margin-top:8px;
  color:#c98cff;
  font-size:18px;
  font-weight:700;
}
.confetti{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:6;
}
.confetti i{
  position:absolute;
  top:50%;
  left:50%;
  width:10px;
  height:18px;
  opacity:0;
}
.confetti.active i{animation:confetti 1.1s ease-out forwards}
.confetti i:nth-child(1){background:#ff7eb6;--x:-160px;--y:-130px}
.confetti i:nth-child(2){background:#8f6cff;--x:-80px;--y:-180px;animation-delay:.05s}
.confetti i:nth-child(3){background:#55c9ff;--x:20px;--y:-190px;animation-delay:.10s}
.confetti i:nth-child(4){background:#66ddb2;--x:110px;--y:-150px;animation-delay:.15s}
.confetti i:nth-child(5){background:#ffb65f;--x:170px;--y:-90px;animation-delay:.20s}
.confetti i:nth-child(6){background:#fff5fb;--x:-130px;--y:-40px;animation-delay:.25s}
.confetti i:nth-child(7){background:#ff7eb6;--x:90px;--y:-40px;animation-delay:.30s}
.result{
  min-height:74px;
  margin-top:18px;
  text-align:center;
  color:#fff5fb;
  font-size:28px;
  font-weight:900;
}
.result .headline{
  color:#ff9d3c;
  text-shadow:0 0 12px rgba(255,157,60,.55);
}
.result .message{
  display:block;
  margin-top:8px;
  color:#c98cff;
  font-size:20px;
}
.flash{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:0;
}
.flash.active{animation:flash .9s ease-out}
.footer{
  text-align:center;
  margin-top:10px;
  color:#9f93aa;
  font-size:12px;
}
@keyframes float{
  from{transform:translateY(-8px) rotate(-2deg)}
  to{transform:translateY(8px) rotate(2deg)}
}
@keyframes pop{
  0%{transform:scale(1);opacity:1}
  55%{transform:scale(1.35);opacity:.8}
  100%{transform:scale(.2);opacity:0}
}
@keyframes reveal{
  from{opacity:0;transform:scale(.7)}
  to{opacity:1;transform:scale(1)}
}
@keyframes confetti{
  0%{opacity:0;transform:translate(0,0) rotate(0deg)}
  20%{opacity:1}
  100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(540deg)}
}
@keyframes flash{
  0%{opacity:0}
  25%{opacity:1;background:radial-gradient(circle,rgba(255,255,255,.32),transparent 48%)}
  100%{opacity:0}
}
@media(max-height:760px){.panel{transform:scale(.84)}}
</style>
</head>
<body>
<div class="scene">
  <div class="glow"></div>
  <div class="sparkle s1">✨</div>
  <div class="sparkle s2">💖</div>
  <div class="sparkle s3">⭐</div>
  <div class="sparkle s4">✨</div>

  <section class="panel">
    <div class="flash" id="flash"></div>

    <div class="title">Balloon Pop</div>
    <div class="subtitle">Five balloons float around. One pops and reveals the prize.</div>

    <div class="field">
      <div class="balloon-wrap b1 float" data-index="0">
        <div class="balloon"></div><div class="string"></div><div class="name">Pink</div>
      </div>
      <div class="balloon-wrap b2 float" data-index="1">
        <div class="balloon"></div><div class="string"></div><div class="name">Purple</div>
      </div>
      <div class="balloon-wrap b3 float" data-index="2">
        <div class="balloon"></div><div class="string"></div><div class="name">Blue</div>
      </div>
      <div class="balloon-wrap b4 float" data-index="3">
        <div class="balloon"></div><div class="string"></div><div class="name">Mint</div>
      </div>
      <div class="balloon-wrap b5 float" data-index="4">
        <div class="balloon"></div><div class="string"></div><div class="name">Gold</div>
      </div>

      <div class="prize-card" id="prizeCard">
        <div class="prize-title" id="prizeTitle">BONUS</div>
        <div class="prize-message" id="prizeMessage">A surprise is revealed!</div>
      </div>

      <div class="confetti" id="confetti">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
    </div>

    <div class="result" id="result">The balloons are floating...</div>
    <div class="footer">StimTake Studio • Daily Pack • Balloon Pop</div>
  </section>
</div>

<script>
(() => {
  const balloons = [...document.querySelectorAll('.balloon-wrap')];
  const result = document.getElementById('result');
  const flash = document.getElementById('flash');
  const prizeCard = document.getElementById('prizeCard');
  const prizeTitle = document.getElementById('prizeTitle');
  const prizeMessage = document.getElementById('prizeMessage');
  const confetti = document.getElementById('confetti');

  let prizes = [
    {title:'Sexy Pose',message:'A playful pose is chosen.'},
    {title:'Slow Dance',message:'Time for a smooth little dance.'},
    {title:'Mystery Choice',message:'The room gets a surprise.'},
    {title:'Model Choice',message:'The model picks what happens next.'},
    {title:'Lucky Bonus',message:'A little extra fun is revealed.'}
  ];

  let running = false;

  function setPrizes(next){
    if(!Array.isArray(next) || !next.length) return;
    prizes = next.slice(0,5).map((p,i)=>({
      title:String(p.title || ('Prize ' + (i+1))),
      message:String(p.message || 'A surprise is revealed!')
    }));
    while(prizes.length < 5){
      prizes.push({
        title:'Prize ' + (prizes.length + 1),
        message:'A surprise is revealed!'
      });
    }
  }

  function reset(){
    balloons.forEach(b=>{
      b.classList.remove('winner','dim','pop');
      b.classList.add('float');
    });
    prizeCard.classList.remove('show');
    confetti.classList.remove('active');
  }

  function pop(options = {}){
    if(running) return false;
    running = true;

    if(Array.isArray(options.prizes)) setPrizes(options.prizes);

    reset();
    result.textContent = 'Which balloon will pop?';

    const forced = Number.isInteger(options.index) ? options.index : null;
    const selected = forced !== null
      ? Math.max(0,Math.min(4,forced))
      : Math.floor(Math.random()*5);

    setTimeout(()=>{
      balloons.forEach((b,i)=>{
        b.classList.remove('float');
        if(i === selected){
          b.classList.add('winner');
        } else {
          b.classList.add('dim');
        }
      });

      setTimeout(()=>{
        balloons[selected].classList.add('pop');

        confetti.classList.remove('active');
        void confetti.offsetWidth;
        confetti.classList.add('active');

        const prize = prizes[selected];

        prizeTitle.textContent = prize.title;
        prizeMessage.textContent = prize.message;
        prizeCard.classList.remove('show');
        void prizeCard.offsetWidth;
        prizeCard.classList.add('show');

        result.innerHTML =
          `🎈 <span class="headline">${prize.title}</span>` +
          `<span class="message">${prize.message}</span>`;

        flash.classList.remove('active');
        void flash.offsetWidth;
        flash.classList.add('active');

        running = false;

        window.parent?.postMessage?.({
          type:'stimtake-daily-balloon-pop-result',
          index:selected,
          prize
        },'*');
      },700);
    },1800);

    return true;
  }

  window.StimTakeDailyBalloonPop = {
    pop,
    setPrizes
  };

  window.addEventListener('message',(event)=>{
    const data = event.data || {};
    if(data.type === 'stimtake-daily-balloon-pop'){
      pop({
        index:Number.isInteger(data.index) ? data.index : undefined,
        prizes:Array.isArray(data.prizes) ? data.prizes : undefined
      });
    }
  });

  setTimeout(()=>pop(),800);
})();
</script>
</body>
</html>
