<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StimTake Halloween Spell Book</title>
<style>
html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:transparent;
  font-family:"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
.scene{
  position:relative;
  width:100%;
  height:100%;
  display:grid;
  place-items:center;
  pointer-events:none;
}
.glow{
  position:absolute;
  width:860px;
  height:820px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(180,76,255,.24),rgba(255,79,184,.08) 46%,transparent 72%);
  filter:blur(18px);
}
.moon{
  position:absolute;
  top:5%;
  right:8%;
  width:118px;
  height:118px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff7df,#ffd98b 58%,#c98e3e);
  box-shadow:0 0 30px rgba(255,217,139,.45);
}
.moon:after{
  content:"";
  position:absolute;
  width:102px;
  height:102px;
  left:31px;
  top:-10px;
  border-radius:50%;
  background:rgba(8,5,14,.97);
}
.web{position:absolute;font-size:110px;opacity:.18}
.w1{top:-10px;left:-6px}
.w2{bottom:-10px;right:-6px;transform:rotate(180deg)}
.bat{position:absolute;font-size:40px;filter:drop-shadow(0 0 5px rgba(180,76,255,.45))}
.b1{top:12%;left:10%;transform:rotate(-12deg)}
.b2{top:20%;right:20%;transform:scale(.8) rotate(10deg)}

.panel{
  position:relative;
  width:min(980px,94vw);
  padding:28px 32px 36px;
  border-radius:28px;
  border:2px solid rgba(180,76,255,.72);
  background:linear-gradient(180deg,rgba(27,13,43,.94),rgba(11,7,22,.95));
  box-shadow:0 0 32px rgba(180,76,255,.55),0 0 64px rgba(255,79,184,.16);
}
.title{
  text-align:center;
  color:#fff2dd;
  font-size:36px;
  font-weight:900;
  letter-spacing:.08em;
  text-transform:uppercase;
  text-shadow:0 0 14px rgba(180,76,255,.9);
}
.subtitle{
  text-align:center;
  color:#d6c3e1;
  margin-top:6px;
  font-size:15px;
}

.book-wrap{
  position:relative;
  width:760px;
  height:470px;
  margin:28px auto 0;
  perspective:1400px;
}
.book{
  position:absolute;
  left:50%;
  top:50%;
  width:620px;
  height:360px;
  margin-left:-310px;
  margin-top:-180px;
  transform-style:preserve-3d;
}
.cover{
  position:absolute;
  inset:0;
  border-radius:24px;
  background:linear-gradient(145deg,#2d123f,#16091f);
  border:5px solid #8b49d2;
  box-shadow:0 0 28px rgba(180,76,255,.55),inset 0 0 30px rgba(255,255,255,.03);
  transform-origin:left center;
  transform:rotateY(0deg);
  transition:transform 1.1s ease;
  z-index:5;
}
.cover:before{
  content:"✦ SPELLS ✦";
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  color:#ffb06a;
  font-size:44px;
  font-weight:900;
  letter-spacing:.08em;
  text-shadow:0 0 16px rgba(255,154,60,.5);
}
.cover:after{
  content:"🕯️";
  position:absolute;
  bottom:26px;
  left:50%;
  transform:translateX(-50%);
  font-size:46px;
}
.book.open .cover{
  transform:rotateY(-155deg);
}

.pages{
  position:absolute;
  inset:12px 10px 12px 10px;
  display:grid;
  grid-template-columns:1fr 1fr;
  background:#efe3cb;
  border-radius:20px;
  box-shadow:inset 0 0 28px rgba(111,78,49,.18);
  overflow:hidden;
}
.page{
  position:relative;
  padding:34px 32px;
  color:#3c253e;
  background:
    linear-gradient(90deg,rgba(255,255,255,.18),rgba(104,70,40,.05)),
    #f3e8d4;
}
.page.left{
  border-right:2px solid rgba(85,56,46,.12);
}
.page.right{
  border-left:2px solid rgba(85,56,46,.08);
}
.page-title{
  text-align:center;
  color:#6f3594;
  font-size:24px;
  font-weight:900;
  letter-spacing:.05em;
}
.runes{
  text-align:center;
  margin-top:20px;
  color:#9b63b8;
  font-size:28px;
  letter-spacing:.18em;
}
.spell-name{
  margin-top:34px;
  text-align:center;
  color:#b44cff;
  font-size:30px;
  font-weight:900;
  opacity:0;
  transform:scale(.85);
  transition:opacity .6s ease,transform .6s ease;
}
.spell-name.show{
  opacity:1;
  transform:scale(1);
}
.spell-text{
  margin-top:16px;
  text-align:center;
  color:#604162;
  font-size:18px;
  font-weight:700;
  line-height:1.35;
  opacity:0;
  transition:opacity .6s ease .15s;
}
.spell-text.show{opacity:1}

.turn-page{
  position:absolute;
  top:12px;
  right:10px;
  width:300px;
  height:336px;
  transform-origin:left center;
  transform:rotateY(0deg);
  background:#f3e8d4;
  border-radius:0 18px 18px 0;
  box-shadow:-8px 0 12px rgba(0,0,0,.08);
  z-index:4;
  opacity:0;
}
.turn-page.animate{
  opacity:1;
  animation:turn 1s ease forwards;
}
.sparkles{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:7;
}
.spark{
  position:absolute;
  color:#fff2dd;
  font-size:24px;
  opacity:0;
}
.spark.active{animation:spark 1.1s ease-out forwards}
.s1{left:24%;top:18%}
.s2{right:24%;top:26%}
.s3{left:36%;bottom:20%}
.s4{right:34%;bottom:18%}

.result{
  min-height:74px;
  margin-top:18px;
  text-align:center;
  color:#fff2dd;
  font-size:28px;
  font-weight:900;
}
.result .pick{
  color:#ff9a3c;
  text-shadow:0 0 12px rgba(255,154,60,.6);
}
.result .message{
  display:block;
  margin-top:8px;
  color:#c78cff;
  font-size:20px;
}
.flash{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:0;
}
.flash.active{animation:flash .9s ease-out}
.footer{
  text-align:center;
  margin-top:10px;
  color:#a99ab7;
  font-size:12px;
}
@keyframes turn{
  0%{transform:rotateY(0deg)}
  100%{transform:rotateY(-180deg)}
}
@keyframes spark{
  0%{opacity:0;transform:scale(.4) rotate(0)}
  45%{opacity:1}
  100%{opacity:0;transform:scale(1.7) rotate(100deg)}
}
@keyframes flash{
  0%{opacity:0}
  25%{opacity:1;background:radial-gradient(circle,rgba(255,255,255,.34),transparent 48%)}
  100%{opacity:0}
}
@media(max-height:760px){.panel{transform:scale(.82)}}
</style>
</head>
<body>
<div class="scene">
  <div class="glow"></div>
  <div class="moon"></div>
  <div class="web w1">🕸️</div>
  <div class="web w2">🕸️</div>
  <div class="bat b1">🦇</div>
  <div class="bat b2">🦇</div>

  <section class="panel">
    <div class="flash" id="flash"></div>

    <div class="title">Spell Book</div>
    <div class="subtitle">The ancient pages open and one spell chooses the night.</div>

    <div class="book-wrap">
      <div class="book" id="book">
        <div class="pages">
          <div class="page left">
            <div class="page-title">Book of Midnight</div>
            <div class="runes">✦ ☾ ✧ ♡ ✦</div>
            <div class="spell-name" id="spellName">Moonlight Charm</div>
          </div>

          <div class="page right">
            <div class="page-title">Tonight's Spell</div>
            <div class="runes">☽ ✧ 🖤 ✧ ☾</div>
            <div class="spell-text" id="spellText">The magic is still deciding...</div>
          </div>
        </div>

        <div class="turn-page" id="turnPage"></div>
        <div class="cover"></div>
      </div>

      <div class="sparkles">
        <div class="spark s1">✦</div>
        <div class="spark s2">✧</div>
        <div class="spark s3">✦</div>
        <div class="spark s4">✧</div>
      </div>
    </div>

    <div class="result" id="result">The spell book is sleeping...</div>
    <div class="footer">StimTake Studio • Halloween Spell Book Placeholder</div>
  </section>
</div>

<script>
(() => {
  const book = document.getElementById('book');
  const turnPage = document.getElementById('turnPage');
  const spellName = document.getElementById('spellName');
  const spellText = document.getElementById('spellText');
  const result = document.getElementById('result');
  const flash = document.getElementById('flash');
  const sparks = [...document.querySelectorAll('.spark')];

  let spells = [
    {name:'Moonlight Charm',message:'A soft little surprise appears'},
    {name:'Velvet Hex',message:'Confidence takes over the room'},
    {name:'Sweet Spell',message:'A playful treat has been summoned'},
    {name:'Midnight Spark',message:'Turn up the energy'},
    {name:'Black Cat Blessing',message:'Luck follows this moment'},
    {name:'Purple Flame',message:'Something bold is about to happen'},
    {name:'Pumpkin Wish',message:'A cute Halloween surprise is chosen'},
    {name:'Witching Hour',message:'The room gets a mysterious twist'}
  ];

  let running = false;

  function setSpells(next){
    if(!Array.isArray(next) || !next.length) return;
    spells = next.map((s,i)=>({
      name:String(s.name || ('Spell ' + (i+1))),
      message:String(s.message || 'A little magic appears')
    })).slice(0,12);
  }

  function cast(options = {}){
    if(running) return false;
    running = true;

    if(Array.isArray(options.spells)) setSpells(options.spells);

    book.classList.remove('open');
    turnPage.classList.remove('animate');
    spellName.classList.remove('show');
    spellText.classList.remove('show');

    spellName.textContent = '...';
    spellText.textContent = 'The magic is still deciding...';
    result.textContent = 'The spell book is opening...';

    const forced = Number.isInteger(options.index) ? options.index : null;
    const selected = forced !== null
      ? Math.max(0,Math.min(spells.length-1,forced))
      : Math.floor(Math.random()*spells.length);

    setTimeout(()=>{
      book.classList.add('open');
    },350);

    setTimeout(()=>{
      turnPage.classList.remove('animate');
      void turnPage.offsetWidth;
      turnPage.classList.add('animate');
      result.textContent = 'The pages are turning...';
    },1350);

    setTimeout(()=>{
      const spell = spells[selected];

      spellName.textContent = spell.name;
      spellText.textContent = spell.message;
      spellName.classList.add('show');
      spellText.classList.add('show');

      sparks.forEach((s,i)=>{
        setTimeout(()=>{
          s.classList.remove('active');
          void s.offsetWidth;
          s.classList.add('active');
        },i*110);
      });

      result.innerHTML =
        `🧙‍♀️ <span class="pick">${spell.name}</span>` +
        `<span class="message">${spell.message}</span>`;

      flash.classList.remove('active');
      void flash.offsetWidth;
      flash.classList.add('active');

      running = false;

      window.parent?.postMessage?.({
        type:'stimtake-spell-book-result',
        index:selected,
        spell
      },'*');
    },2700);

    return true;
  }

  window.StimTakeSpellBook = {
    cast,
    setSpells
  };

  window.addEventListener('message',(event)=>{
    const data = event.data || {};
    if(data.type === 'stimtake-spell-book-cast'){
      cast({
        index:Number.isInteger(data.index) ? data.index : undefined,
        spells:Array.isArray(data.spells) ? data.spells : undefined
      });
    }
  });

  setTimeout(()=>cast(),800);
})();
</script>
</body>
</html>
