<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StimTake Halloween Graveyard Pick</title>
<style>
html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:transparent;
  font-family:"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
.scene{
  position:relative;
  width:100%;
  height:100%;
  display:grid;
  place-items:center;
  pointer-events:none;
}
.glow{
  position:absolute;
  width:860px;
  height:800px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(180,76,255,.22),rgba(255,79,184,.08) 46%,transparent 72%);
  filter:blur(18px);
}
.moon{
  position:absolute;
  top:5%;
  right:8%;
  width:120px;
  height:120px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff7df,#ffd98b 58%,#c98e3e);
  box-shadow:0 0 30px rgba(255,217,139,.45);
}
.moon:after{
  content:"";
  position:absolute;
  width:104px;
  height:104px;
  left:32px;
  top:-10px;
  border-radius:50%;
  background:rgba(8,5,14,.97);
}
.web{position:absolute;font-size:110px;opacity:.18}
.w1{top:-10px;left:-6px}
.w2{bottom:-10px;right:-6px;transform:rotate(180deg)}
.bat{position:absolute;font-size:38px;filter:drop-shadow(0 0 5px rgba(180,76,255,.45))}
.b1{top:13%;left:10%;transform:rotate(-12deg)}
.b2{top:21%;right:20%;transform:scale(.8) rotate(10deg)}

.panel{
  position:relative;
  width:min(980px,94vw);
  padding:28px 32px 36px;
  border-radius:28px;
  border:2px solid rgba(180,76,255,.72);
  background:linear-gradient(180deg,rgba(27,13,43,.94),rgba(11,7,22,.95));
  box-shadow:0 0 32px rgba(180,76,255,.55),0 0 64px rgba(255,79,184,.18);
}
.title{
  text-align:center;
  color:#fff2dd;
  font-size:36px;
  font-weight:900;
  letter-spacing:.08em;
  text-transform:uppercase;
  text-shadow:0 0 14px rgba(180,76,255,.9);
}
.subtitle{
  text-align:center;
  color:#d6c3e1;
  margin-top:6px;
  font-size:15px;
}
.graveyard{
  position:relative;
  width:840px;
  height:470px;
  margin:26px auto 0;
  border-radius:22px;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 110%,rgba(92,45,120,.2),transparent 48%),
    linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,.01));
  border:1px solid rgba(255,255,255,.07);
}
.ground{
  position:absolute;
  left:-5%;
  right:-5%;
  bottom:-20px;
  height:160px;
  background:
    radial-gradient(ellipse at 20% 50%,rgba(68,42,73,.95),transparent 45%),
    radial-gradient(ellipse at 50% 45%,rgba(43,27,50,.95),transparent 45%),
    radial-gradient(ellipse at 80% 55%,rgba(61,36,70,.95),transparent 45%);
  filter:blur(1px);
}
.fog{
  position:absolute;
  left:-10%;
  right:-10%;
  bottom:15px;
  height:130px;
  background:
    radial-gradient(ellipse at 20% 70%,rgba(255,255,255,.08),transparent 38%),
    radial-gradient(ellipse at 50% 65%,rgba(255,255,255,.06),transparent 42%),
    radial-gradient(ellipse at 80% 70%,rgba(255,255,255,.08),transparent 38%);
  filter:blur(14px);
}
.tomb{
  position:absolute;
  bottom:-165px;
  width:150px;
  height:220px;
  border-radius:55px 55px 12px 12px;
  background:linear-gradient(145deg,#5a5464,#312c39 75%);
  border:4px solid #777080;
  box-shadow:0 0 16px rgba(0,0,0,.4),inset 0 0 24px rgba(255,255,255,.04);
  transition:bottom .75s ease,transform .35s ease,opacity .35s ease,box-shadow .35s ease;
  z-index:3;
}
.t1{left:52px}.t2{left:216px}.t3{left:380px}.t4{left:544px}.t5{left:708px}
.tomb:before{
  content:"✦";
  position:absolute;
  top:24px;
  left:0;
  right:0;
  text-align:center;
  color:#b985ff;
  font-size:30px;
  opacity:.65;
}
.tomb-name{
  position:absolute;
  top:74px;
  left:10px;
  right:10px;
  text-align:center;
  color:#efe7f5;
  font-size:14px;
  font-weight:900;
  letter-spacing:.06em;
}
.tomb-number{
  position:absolute;
  bottom:26px;
  left:0;
  right:0;
  text-align:center;
  color:#bdb5c3;
  font-size:28px;
  font-weight:900;
}
.tomb.rise{bottom:62px}
.tomb.dim{opacity:.18;filter:saturate(.45)}
.tomb.winner{
  transform:translateY(-10px) scale(1.08);
  border-color:#ff9a3c;
  box-shadow:0 0 28px rgba(255,154,60,.7),0 0 54px rgba(180,76,255,.6);
}
.tomb.winner:after{
  content:"👑";
  position:absolute;
  top:-38px;
  left:0;
  right:0;
  text-align:center;
  font-size:34px;
}
.light{
  position:absolute;
  width:190px;
  height:260px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,154,60,.25),rgba(199,140,255,.12) 45%,transparent 72%);
  filter:blur(12px);
  opacity:0;
  z-index:2;
}
.light.active{
  animation:lightUp 1.1s ease-out forwards;
}
.result{
  min-height:74px;
  margin-top:18px;
  text-align:center;
  color:#fff2dd;
  font-size:28px;
  font-weight:900;
}
.result .pick{
  color:#ff9a3c;
  text-shadow:0 0 12px rgba(255,154,60,.6);
}
.result .message{
  display:block;
  margin-top:8px;
  color:#c78cff;
  font-size:20px;
}
.flash{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:0;
}
.flash.active{animation:flash .9s ease-out}
.footer{
  text-align:center;
  margin-top:10px;
  color:#a99ab7;
  font-size:12px;
}
@keyframes lightUp{
  0%{opacity:0;transform:scale(.6)}
  45%{opacity:1}
  100%{opacity:.8;transform:scale(1.2)}
}
@keyframes flash{
  0%{opacity:0}
  25%{opacity:1;background:radial-gradient(circle,rgba(255,255,255,.34),transparent 48%)}
  100%{opacity:0}
}
@media(max-height:760px){.panel{transform:scale(.82)}}
</style>
</head>
<body>
<div class="scene">
  <div class="glow"></div>
  <div class="moon"></div>
  <div class="web w1">🕸️</div>
  <div class="web w2">🕸️</div>
  <div class="bat b1">🦇</div>
  <div class="bat b2">🦇</div>

  <section class="panel">
    <div class="flash" id="flash"></div>

    <div class="title">Graveyard Pick</div>
    <div class="subtitle">Five tombstones rise. One reveals the haunted choice.</div>

    <div class="graveyard" id="graveyard">
      <div class="ground"></div>
      <div class="fog"></div>

      <div class="tomb t1" data-index="0">
        <div class="tomb-name">VELVET</div>
        <div class="tomb-number">1</div>
      </div>

      <div class="tomb t2" data-index="1">
        <div class="tomb-name">LUNA</div>
        <div class="tomb-number">2</div>
      </div>

      <div class="tomb t3" data-index="2">
        <div class="tomb-name">HEXIE</div>
        <div class="tomb-number">3</div>
      </div>

      <div class="tomb t4" data-index="3">
        <div class="tomb-name">RAVEN</div>
        <div class="tomb-number">4</div>
      </div>

      <div class="tomb t5" data-index="4">
        <div class="tomb-name">MIDNIGHT</div>
        <div class="tomb-number">5</div>
      </div>

      <div class="light" id="light"></div>
    </div>

    <div class="result" id="result">The graveyard is waking up...</div>
    <div class="footer">StimTake Studio • Halloween Graveyard Pick Placeholder</div>
  </section>
</div>

<script>
(() => {
  const graveyard = document.getElementById('graveyard');
  const tombs = [...document.querySelectorAll('.tomb')];
  const light = document.getElementById('light');
  const result = document.getElementById('result');
  const flash = document.getElementById('flash');

  let names = ['Velvet','Luna','Hexie','Raven','Midnight'];
  let outcomes = [
    'A sweet surprise rises from the dark',
    'A spooky bonus has been chosen',
    'A playful dare emerges',
    'A lucky Halloween moment appears',
    'A mystery reward has awakened'
  ];

  let running = false;

  function setNames(next){
    if(!Array.isArray(next) || !next.length) return;
    names = next.slice(0,5);
    while(names.length < 5) names.push('Tomb ' + (names.length + 1));
    tombs.forEach((t,i)=>{
      t.querySelector('.tomb-name').textContent = names[i].toUpperCase();
    });
  }

  function reset(){
    tombs.forEach(t=>{
      t.classList.remove('rise','dim','winner');
    });
    light.classList.remove('active');
  }

  function placeLight(el){
    const gr = graveyard.getBoundingClientRect();
    const r = el.getBoundingClientRect();
    light.style.left = (r.left - gr.left + r.width/2 - 95) + 'px';
    light.style.top = (r.top - gr.top + r.height/2 - 130) + 'px';
  }

  function pick(options = {}){
    if(running) return false;
    running = true;

    if(Array.isArray(options.names)) setNames(options.names);

    reset();
    result.textContent = 'The tombstones are rising...';

    const forced = Number.isInteger(options.index) ? options.index : null;
    const selected = forced !== null
      ? Math.max(0,Math.min(4,forced))
      : Math.floor(Math.random()*5);

    tombs.forEach((t,i)=>{
      setTimeout(()=>t.classList.add('rise'),i*220);
    });

    setTimeout(()=>{
      tombs.forEach((t,i)=>{
        if(i === selected){
          t.classList.add('winner');
        }else{
          t.classList.add('dim');
        }
      });

      placeLight(tombs[selected]);
      void light.offsetWidth;
      light.classList.add('active');

      const message = outcomes[Math.floor(Math.random()*outcomes.length)];

      result.innerHTML =
        `🪦 <span class="pick">${names[selected]}</span>` +
        `<span class="message">${message}</span>`;

      flash.classList.remove('active');
      void flash.offsetWidth;
      flash.classList.add('active');

      running = false;

      window.parent?.postMessage?.({
        type:'stimtake-graveyard-pick-result',
        index:selected,
        name:names[selected],
        message
      },'*');
    },1900);

    return true;
  }

  setNames(names);

  window.StimTakeGraveyardPick = {
    pick,
    setNames
  };

  window.addEventListener('message',(event)=>{
    const data = event.data || {};
    if(data.type === 'stimtake-graveyard-pick'){
      pick({
        index:Number.isInteger(data.index) ? data.index : undefined,
        names:Array.isArray(data.names) ? data.names : undefined
      });
    }
  });

  setTimeout(()=>pick(),800);
})();
</script>
</body>
</html>
